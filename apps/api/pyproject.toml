[project]
name = "svoi-api"
version = "0.0.0"
description = "Svoi backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "geoalchemy2>=0.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "svoi-contracts",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svoi_api"]
