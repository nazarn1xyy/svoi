[project]
name = "svoi-bot"
version = "0.0.0"
description = "Svoi Telegram bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15",
    "babel>=2.16",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "structlog>=24.4",
    "svoi-contracts",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svoi_bot"]
