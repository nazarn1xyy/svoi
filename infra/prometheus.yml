# Scrapes /metrics of the API (B0.1) and both workers (tech.md section 2).
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: api-worker
    static_configs:
      - targets: ["api-worker:9100"]
  - job_name: bot-worker
    static_configs:
      - targets: ["bot-worker:9100"]
